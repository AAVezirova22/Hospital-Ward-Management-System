spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:hospital}}
    username: ${DATABASE_USER:hospital}
    password: ${DATABASE_PASSWORD:hospital-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
  error:
    include-message: never
app:
  demo: ${DEMO_MODE:false}
  public-url: ${PUBLIC_APP_URL:}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    expiry-minutes: ${EMAIL_CONFIRMATION_MINUTES:30}
  email:
    resend-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
  seed: ${DEMO_SEED:true}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  ai:
    mode: ${AI_MODE:local}
    url: ${AI_URL:}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: 15
    rate-limit: 20
    action-ttl-seconds: 300

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
management:
  endpoints:
    web:
      base-path: /api/v1/management
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

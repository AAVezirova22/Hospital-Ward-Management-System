spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:hospital}}
    username: ${DATABASE_USER:hospital}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
  error:
    include-message: never
app:
  demo: ${DEMO_MODE:false}
  demo-token: ${DEMO_TOKEN:}
  public-url: ${PUBLIC_APP_URL:}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    expiry-minutes: ${EMAIL_CONFIRMATION_MINUTES:30}
  email:
    resend-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
  seed: ${DEMO_SEED:true}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  ai:
    mode: ${AI_MODE:local}
    url: ${AI_URL:}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: 15
    rate-limit: 20
    action-ttl-seconds: 300
  security:
    login-backoff:
      max-entries: ${LOGIN_BACKOFF_MAX_ENTRIES:10000}
      max-username-length: ${LOGIN_BACKOFF_MAX_USERNAME_LENGTH:64}
      first-lock-threshold: ${LOGIN_BACKOFF_FIRST_LOCK_THRESHOLD:5}
      first-lock-duration: ${LOGIN_BACKOFF_FIRST_LOCK_DURATION:30s}
      extended-lock-threshold: ${LOGIN_BACKOFF_EXTENDED_LOCK_THRESHOLD:8}
      extended-lock-duration: ${LOGIN_BACKOFF_EXTENDED_LOCK_DURATION:5m}
      idle-ttl: ${LOGIN_BACKOFF_IDLE_TTL:24h}
      cleanup-interval: ${LOGIN_BACKOFF_CLEANUP_INTERVAL:1m}

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
management:
  endpoints:
    web:
      base-path: /api/v1/management
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

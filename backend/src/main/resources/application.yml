spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_PERIOD:20s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:hospital}}
    username: ${DATABASE_USER:hospital}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: hospital-db
      # Per instance. Keep instances x maximum-pool-size below PostgreSQL max_connections minus
      # reserved/admin connections; see docs/deployment.md.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      # Wait for a pooled connection before failing the request with DATABASE_UNAVAILABLE.
      connection-timeout: ${DATABASE_POOL_TIMEOUT_MS:5000}
      data-source-properties:
        connectTimeout: ${DATABASE_CONNECT_TIMEOUT_SECONDS:10}
        # Server-side cap on any single statement; exceeded statements fail with DATABASE_TIMEOUT.
        options: -c statement_timeout=${DATABASE_STATEMENT_TIMEOUT_MS:15000}
  transaction:
    # Upper bound for the database work of one API request.
    default-timeout: ${API_TRANSACTION_TIMEOUT:30s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  # Finish in-flight requests on SIGTERM; work still running after the grace period is aborted
  # and its open transaction rolls back when the connection closes.
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
  error:
    include-message: never
app:
  # development | demo | staging | production. DEMO_MODE requires demo; production forbids demo flags.
  environment: ${APP_ENVIRONMENT:development}
  demo: ${DEMO_MODE:false}
  demo-token: ${DEMO_TOKEN:}
  public-url: ${PUBLIC_APP_URL:}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    expiry-minutes: ${EMAIL_CONFIRMATION_MINUTES:30}
  email:
    resend-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
  seed: ${DEMO_SEED:true}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  ai:
    mode: ${AI_MODE:local}
    url: ${AI_URL:}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: 15
    rate-limit: 20
    action-ttl-seconds: 300

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
management:
  endpoints:
    web:
      base-path: /api/v1/management
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

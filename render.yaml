# Dedicated synthetic demo. Import this Blueprint; no secrets are stored here.
#
# The service names below must match the services that actually serve the deployment
# (https://hospital-ward-frontend.onrender.com), otherwise a Blueprint sync creates a second set
# of services and leaves the live ones wired by hand. Rename here to match, or rename in Render.
#
# The web service reaches the API over Render's private network, so both services must stay in the
# same region. API_INTERNAL_HOSTPORT is read while the web service is BUILT, not when it starts:
# Next writes the proxy destination into the build output. Changing the address therefore requires
# a rebuild ("Clear build cache & deploy"), not a restart.
databases:
  - name: medcore-demo-db
    plan: basic-256mb
    databaseName: hospital
    user: hospital
    ipAllowList: []

services:
  - type: web
    name: medcore-demo-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: { name: medcore-demo-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: medcore-demo-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: medcore-demo-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: medcore-demo-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: medcore-demo-db, property: password }
      - key: BOOTSTRAP_PASSWORD
        generateValue: true
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_MODE
        value: local
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Medcore <onboarding@resend.dev>
      - key: PUBLIC_APP_URL
        sync: false
  - type: web
    name: hospital-ward-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Private host:port of the API service. The build fails with an explicit message when this
      # is missing, rather than proxying /api to a loopback address that holds no backend.
      - key: API_INTERNAL_HOSTPORT
        fromService: { name: medcore-demo-api, type: web, property: hostport }
      - key: PUBLIC_APP_URL
        sync: false

# Blueprint for the existing hospital-ward services.
# Keep these names and Docker settings aligned with the live Render services.
databases:
  - name: hospital-ward-demo-db
    plan: 0.1c-256mb
    databaseName: hospital_ward_demo_db
    user: hospital_ward_demo_db_user
    ipAllowList: []

services:
  - type: web
    name: hospital-ward-backend
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: { name: hospital-ward-demo-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: hospital-ward-demo-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: hospital-ward-demo-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: hospital-ward-demo-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: hospital-ward-demo-db, property: password }
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_MODE
        value: local
      - key: EMAIL_FROM
        value: "Medcore <onboarding@resend.dev>"
  - type: web
    name: hospital-ward-frontend
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /manifest.webmanifest
    envVars:
      # Build-time private address of the API service.
      - key: API_INTERNAL_URL
        value: ""
      - key: API_INTERNAL_HOSTPORT
        fromService: { name: hospital-ward-backend, type: web, property: hostport }

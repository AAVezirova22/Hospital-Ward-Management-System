name: Verify Medcore
on: [push, pull_request]
jobs:
  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: ci-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital -d hospital_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/hospital_test
      TEST_DATABASE_USER: hospital
      TEST_DATABASE_PASSWORD: ci-database-password
      DATABASE_URL: jdbc:postgresql://localhost:5432/hospital_test
      DATABASE_USER: hospital
      DATABASE_PASSWORD: ci-database-password
      BOOTSTRAP_PASSWORD: IntegrationPassword123!
      E2E_PASSWORD: IntegrationPassword123!
      COOKIE_SECURE: false
      DEMO_SEED: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend integration, security, AI and concurrency tests
        run: mvn -B -f backend/pom.xml verify
      - name: Frontend typecheck and production build
        working-directory: frontend
        run: npm ci && npm run test && npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          java -jar backend/target/hospital-1.0.0.war > backend.log 2>&1 &
          npm --prefix frontend run dev > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null \
              && curl -fsS http://localhost:3000/app/dashboard >/dev/null; then break; fi
            sleep 1
          done
          npm --prefix frontend run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            backend/target/surefire-reports
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
